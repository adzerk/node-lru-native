language: node_js

os:
  - linux
  - osx

addons:
  apt:
    packages:
      - valgrind

script:
  - npm run lint
  - if [[ "$TRAVIS_OS_NAME" == "linux" ]]; then npm run valgrind; fi
  - if [[ "$TRAVIS_OS_NAME" == "osx" ]]; then npm t; fi

node_js:
  - 20
  - 22
  - 24

cache:
  directories:
    - "node_modules"
